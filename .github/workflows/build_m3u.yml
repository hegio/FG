name: Auto Update M3U Playlist

on:
  schedule:
    # 每 24 小时自动运行一次 (国际标准时间 UTC 转换为北京时间)
    - cron: '0 */24 * * *'
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予工作流向仓库提交更新文件的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create Update Script
        run: |
          cat << 'EOF' > generate_m3u.py
import os
import re
import urllib.request
import concurrent.futures

# 需要处理的目标分类名称（按您指定的顺序排序）
target_names = [
    "🐬综合直播 海豚影视交流群 TG：@hshsjk9",
    "🐬风云源 海豚影视永久免费如有收费的都是骗子",
    "🐬各大源合集",
    "🐬Nettv",
    "🐬电视家",
    "🐬地方直播2",
    "🐬薄荷直播",
    "🐬咪咕直播",
    "🐬juli",
    "🐬国际TV",
    "🐬live",
    "🐬裤佬TV2",
    "🐬Mytv",
    "🐬易发源 有🔞",
    "🐬港奥台国际",
    "🐬中港台直播源",
    "🐬4GTV(梯子任何节点)1080p",
    "🐬4GTV(免梯子)1080p",
    "🐬jackTV(梯子)",
    "develop202",
]

 # 【目录结构配置开关】
# False = 默认 2 级目录（如：group-title="🐬电视家"）
# True  = 模拟 3 级目录（如：group-title="🐬电视家 - 央视频道"，能更精细地展示源文件内的内部子分类）
USE_3_LEVEL_DIRECTORY = True

# 敏感词过滤器
NSFW_KEYWORDS = ["18+", "🔞", "adult", "福利", "成人", "av", "xxx", "sex", "erotic", "午夜", "18a"]

# URL 探测超时（秒）
PROBE_TIMEOUT = 5
PROBE_MAX_WORKERS = 30


def fetch_content(url):
    """安全抓取网页或文件内容"""
    try:
        req = urllib.request.Request(
            url,
            headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
        )
        with urllib.request.urlopen(req, timeout=15) as response:
            return response.read().decode('utf-8', errors='ignore')
    except Exception as e:
        print(f"抓取链接失败 {url}: {e}")
        return ""


def probe_url(url, timeout=PROBE_TIMEOUT):
    """快速探测 URL 是否可访问"""
    try:
        req = urllib.request.Request(url, method='HEAD', headers={
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
        })
        with urllib.request.urlopen(req, timeout=timeout) as resp:
            return resp.status < 400
    except:
        # HEAD 不支持时降级为 GET（只读前 1KB）
        try:
            req = urllib.request.Request(url, headers={
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
            })
            with urllib.request.urlopen(req, timeout=timeout) as resp:
                _ = resp.read(1024)
                return True
        except:
            return False


def clean_group_name(name):
    return name.replace(" 有🔞", "").replace("有🔞", "").strip()


def is_nsfw(text):
    text_lower = text.lower()
    return any(keyword in text_lower for keyword in NSFW_KEYWORDS)


def parse_m3u(content, main_group):
    channels = []
    lines = content.splitlines()
    current_inf = None
    for line in lines:
        line = line.strip()
        if not line or line.startswith("#EXTM3U"):
            continue
        if line.startswith("#EXTINF"):
            current_inf = line
        elif line.startswith("#"):
            continue
        else:
            if current_inf:
                sub_group = ""
                group_match = re.search(r'group-title="([^"]+)"', current_inf)
                if group_match:
                    sub_group = group_match.group(1).strip()

                name = "未知频道"
                comma_idx = current_inf.rfind(',')
                if comma_idx != -1:
                    name = current_inf[comma_idx+1:].strip()

                if is_nsfw(name) or is_nsfw(sub_group):
                    current_inf = None
                    continue

                clean_main = clean_group_name(main_group)
                if USE_3_LEVEL_DIRECTORY and sub_group:
                    group_title = f"{clean_main} - {sub_group}"
                else:
                    group_title = clean_main

                channels.append({"name": name, "url": line, "group_title": group_title})
                current_inf = None
    return channels


def parse_txt(content, main_group):
    channels = []
    current_genre = ""
    lines = content.splitlines()
    for line in lines:
        line = line.strip()
        if not line:
            continue
        if "#genre#" in line:
            current_genre = line.split(",")[0].strip()
            continue
        parts = re.split(r'[,#$]', line, 1)
        if len(parts) == 2:
            name, url = parts[0].strip(), parts[1].strip()
            if url.startswith(("http://", "https://", "rtmp://", "rtsp://", "p2p://", "mitv://")):
                if is_nsfw(name) or is_nsfw(current_genre):
                    continue

                clean_main = clean_group_name(main_group)
                if USE_3_LEVEL_DIRECTORY and current_genre:
                    group_title = f"{clean_main} - {current_genre}"
                else:
                    group_title = clean_main

                channels.append({"name": name, "url": url, "group_title": group_title})
    return channels


def parse_source(content, main_group):
    if "#EXTM3U" in content or "#EXTINF" in content:
        return parse_m3u(content, main_group)
    else:
        return parse_txt(content, main_group)


def main():
    all_channels = []

    # 1. 处理主 lives.txt 中的频道
    lives_url = "https://raw.githubusercontent.com/hegio/FG/main/Lv/lives.txt"
    print("正在下载 lives.txt 主索引...")
    lives_content = fetch_content(lives_url)
    if lives_content:
        sources = {}
        for line in lives_content.splitlines():
            line = line.strip()
            if not line or line.startswith("#"):
                continue
            parts = line.split(",", 1)
            if len(parts) == 2:
                name, url = parts[0].strip(), parts[1].strip()
                sources[name] = url

        matched_sources = {}
        for target in target_names:
            if target in sources:
                matched_sources[target] = sources[target]
            else:
                for s_name, s_url in sources.items():
                    if target in s_name or s_name in target:
                        matched_sources[target] = s_url
                        break

        for target in target_names:
            if target not in matched_sources:
                print(f"未在 lives.txt 中找到匹配的分类: '{target}'，跳过。")
                continue
            url = matched_sources[target]
            print(f"正在处理分类: '{target}' -> 链接: {url}")
            source_content = fetch_content(url)
            if source_content:
                channels = parse_source(source_content, target)
                all_channels.extend(channels)
                print(f" 成功提取了 {len(channels)} 个频道")
    else:
        print("无法加载 lives.txt，跳过主源处理。")

    # 2. 动态读取本地 extra_sources.txt 中的额外单源
    extra_filename = "extra_sources.txt"
    if os.path.exists(extra_filename):
        print(f"检测到本地配置文件 {extra_filename}，开始读取...")
        try:
            with open(extra_filename, "r", encoding="utf-8") as f:
                for line in f:
                    line = line.strip()
                    if not line or line.startswith("#"):
                        continue
                    parts = line.split(",", 1)
                    if len(parts) == 2:
                        ext_name, ext_url = parts[0].strip(), parts[1].strip()
                        print(f"正在抓取额外单源: '{ext_name}' -> 链接: {ext_url}")
                        source_content = fetch_content(ext_url)
                        if source_content:
                            channels = parse_source(source_content, ext_name)
                            all_channels.extend(channels)
                            print(f" 额外单源 '{ext_name}' 提取成功，共 {len(channels)} 个频道")
        except Exception as e:
            print(f"读取本地 {extra_filename} 发生错误: {e}")

    # 3. 去重
    seen = set()
    unique_channels = []
    for ch in all_channels:
        key = (ch['group_title'], ch['name'], ch['url'])
        if key not in seen:
            seen.add(key)
            unique_channels.append(ch)

    print(f"去重后共 {len(unique_channels)} 个频道，开始 URL 可用性探测...")

    # 4. 并发探测 URL 可用性
    alive_channels = []
    dead_count = 0
    with concurrent.futures.ThreadPoolExecutor(max_workers=PROBE_MAX_WORKERS) as pool:
        futures = {pool.submit(probe_url, ch['url']): ch for ch in unique_channels}
        for future in concurrent.futures.as_completed(futures):
            ch = futures[future]
            try:
                if future.result():
                    alive_channels.append(ch)
                else:
                    dead_count += 1
                    print(f"  [DEAD] {ch['name']} ({ch['group_title']})")
            except Exception as e:
                dead_count += 1
                print(f"  [DEAD] {ch['name']} - 探测异常: {e}")

    print(f"探测完成: 存活 {len(alive_channels)} 个，失效 {dead_count} 个")

    # 5. 输出 M3U
    output_filename = "鱼豚无18b.m3u"
    print(f"正在写入 {output_filename}...")
    try:
        with open(output_filename, "w", encoding="utf-8") as f:
            f.write("#EXTM3U\n")
            for ch in alive_channels:
                f.write(f'#EXTINF:-1 tvg-name="{ch["name"]}" group-title="{ch["group_title"]}",{ch["name"]}\n')
                f.write(f'{ch["url"]}\n')
        print(f"M3U 播放列表更新成功！共 {len(alive_channels)} 个有效频道")
    except Exception as e:
        print(f"写入文件失败: {e}")


if __name__ == "__main__":
    main()
PYEOF

      - name: Execute script
        run: python generate_m3u.py

      - name: Clean build files
        run: rm -f generate_m3u.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add 鱼豚无18b.m3u
          git diff-index --quiet HEAD || git commit -m "Auto Update: 鱼豚无18b.m3u (每24小时自动更新，含URL存活探测)"
          git push
