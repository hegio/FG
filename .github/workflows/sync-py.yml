name: Sync PY Plugins to JSON

on:
  push:
    paths:
      - 'PY/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-py:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan PY directory and sync to JSON files
        run: |
          python3 << 'PYEOF'
          import os
          import json
          import re
          import urllib.request

          REPO = "hegio/FG"
          BRANCH = "main"
          PY_DIR = "PY"
          TARGET_FILES = ["鱼壳海豚无18加", "ok海豚无18加"]
          RAW_BASE = f"https://ghfast.top/https://raw.githubusercontent.com/{REPO}/{BRANCH}/{PY_DIR}"
          PY_API_PATTERN = re.compile(r'/PY/[^/]+\.py', re.IGNORECASE)

          # 分类推断规则
          CATEGORY_RULES = [
              ("直播", ["直播", "zb", "live", "电视", "tv", "iptv", "m3u", "轮播", "一起看"]),
              ("体育", ["体育", "ty", "sport", "球", "赛事", "竞技", "运动"]),
              ("音乐", ["音乐", "music", "dj", "fm", "电台", "radio", "歌曲", "mp3"]),
              ("听书", ["听书", "ts", "audio", "有声", "小说", "广播", "相声", "评书"]),
              ("短剧", ["短剧", "微剧", "爽文", "穿越", "逆袭", "都市"]),
              ("动漫", ["动漫", "动画", "anime", "cartoon", "少儿", "儿童"]),
              ("综艺", ["综艺", "娱乐", "真人秀", "选秀", "脱口秀"]),
              ("纪录", ["纪录", "documentary", "探索", "发现", "档案"]),
              ("其他", ["其他", "other", "工具", "测试"]),
          ]

          def detect_category(filename):
              name_lower = filename.lower()
              for category, keywords in CATEGORY_RULES:
                  for kw in keywords:
                      if kw.lower() in name_lower:
                          return category
              return "追剧"

          def generate_key(filename):
              base = os.path.splitext(filename)[0]
              key = re.sub(r'[^\w\u4e00-\u9fff]', '', base).lower()
              if not key:
                  key = "py" + str(hash(base) % 10000)
              return key[:20]

          def fetch_py_files():
              api_url = f"https://api.github.com/repos/{REPO}/contents/{PY_DIR}?ref={BRANCH}"
              headers = {
                  'User-Agent': 'Mozilla/5.0',
                  'Accept': 'application/vnd.github.v3+json'
              }
              token = os.environ.get('GITHUB_TOKEN')
              if token:
                  headers['Authorization'] = f'token {token}'

              try:
                  req = urllib.request.Request(api_url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      items = json.loads(resp.read().decode('utf-8'))
                  py_files = []
                  for item in items:
                      if item.get('type') == 'file' and item['name'].endswith('.py'):
                          py_files.append(item['name'])
                  return py_files
              except Exception as e:
                  print(f"[WARN] GitHub API 获取失败: {e}，降级扫描本地目录")
                  if os.path.isdir(PY_DIR):
                      return [f for f in os.listdir(PY_DIR) if f.endswith('.py')]
                  return []

          def build_expected_entries(py_files):
              entries = {}
              for filename in py_files:
                  category = detect_category(filename)
                  key = generate_key(filename)
                  api_url = f"{RAW_BASE}/{filename}"
                  entries[api_url] = {
                      "key": key,
                      "name": f"🐬{filename}[{category}]",
                      "type": 3,
                      "api": api_url
                  }
              return entries

          def is_py_plugin(site):
              api = site.get('api', '')
              return bool(PY_API_PATTERN.search(api))

          def sync_json(target_file, expected_entries):
              if not os.path.isfile(target_file):
                  print(f"[WARN] {target_file} 不存在，跳过")
                  return False

              try:
                  with open(target_file, 'r', encoding='utf-8') as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"[ERROR] 读取 {target_file} 失败: {e}")
                  return False

              sites = data.get('sites', [])
              modified = False

              # 1. 删除：sites 中存在但 PY 中已不存在的 py 插件
              new_sites = []
              removed = 0
              for site in sites:
                  api = site.get('api', '')
                  if is_py_plugin(site) and api not in expected_entries:
                      print(f"[DEL] 删除 {site.get('name', site.get('key', '?'))} (PY文件已不存在)")
                      removed += 1
                      modified = True
                  else:
                      new_sites.append(site)

              # 2. 添加：PY 中存在但 sites 中还没有的
              existed_apis = {s.get('api', '') for s in new_sites}
              added = 0
              for api_url, entry in expected_entries.items():
                  if api_url not in existed_apis:
                      new_sites.append(entry)
                      print(f"[ADD] 添加 {entry['name']} 到 {target_file}")
                      added += 1
                      modified = True

              if modified:
                  data['sites'] = new_sites
                  with open(target_file, 'w', encoding='utf-8') as f:
                      json.dump(data, f, ensure_ascii=False, indent=4)
                  print(f"[DONE] {target_file}: 删除 {removed} 个，新增 {added} 个")
              else:
                  print(f"[INFO] {target_file}: 无需变更")

              return modified

          def main():
              print("[START] 扫描 PY 目录并双向同步...")
              py_files = fetch_py_files()

              if not py_files:
                  print("[INFO] 未找到 .py 文件，将清理所有 PY 插件条目")

              print(f"[INFO] 当前 PY 目录有 {len(py_files)} 个 .py 文件:")
              for pf in py_files:
                  print(f"  - {pf}")

              expected = build_expected_entries(py_files)

              modified_any = False
              for target in TARGET_FILES:
                  if sync_json(target, expected):
                      modified_any = True

              if modified_any:
                  print("[DONE] 有文件被修改，准备提交")
              else:
                  print("[DONE] 所有文件已是最新")

          if __name__ == '__main__':
              main()
          PYEOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "✅ 没有需要提交的改动"
          else
            git commit -m "🔄 Auto-sync PY plugins [$(date '+%Y-%m-%d %H:%M')]"                        -m "- 自动侦测 PY 目录变动（增删 .py 文件）"                        -m "- 双向同步到 鱼壳海豚无18加 / ok海豚无18加"
            git push
            echo "🚀 提交已完成"
          fi
