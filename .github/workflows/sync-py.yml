name: Sync PY Plugins to JSON

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-py:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read py.txt and sync to JSON files
        run: |
          python3 << 'PYEOF'
          import os
          import json
          import re

          PY_TXT = "Lv/py.txt"
          TARGET_FILES = ["鱼壳海豚无18加", "ok海豚无18加"]
          PY_API_PATTERN = re.compile(r'/PY/[^/]+\.py', re.IGNORECASE)
          MANUAL_GROUP = "手动"

          # 分类推断规则
          CATEGORY_RULES = [
              ("直播", ["直播", "zb", "live", "电视", "tv", "iptv", "m3u", "轮播", "一起看"]),
              ("体育", ["体育", "ty", "sport", "球", "赛事", "竞技", "运动"]),
              ("音乐", ["音乐", "music", "dj", "fm", "电台", "radio", "歌曲", "mp3"]),
              ("听书", ["听书", "ts", "audio", "有声", "小说", "广播", "相声", "评书"]),
              ("短剧", ["短剧", "微剧", "爽文", "穿越", "逆袭", "都市"]),
              ("动漫", ["动漫", "动画", "anime", "cartoon", "少儿", "儿童"]),
              ("综艺", ["综艺", "娱乐", "真人秀", "选秀", "脱口秀"]),
              ("纪录", ["纪录", "documentary", "探索", "发现", "档案"]),
              ("其他", ["其他", "other", "工具", "测试"]),
          ]

          def detect_category(filename):
              name_lower = filename.lower()
              for category, keywords in CATEGORY_RULES:
                  for kw in keywords:
                      if kw.lower() in name_lower:
                          return category
              return "追剧"

          def generate_key(filename):
              base = os.path.splitext(filename)[0]
              key = re.sub(r'[^\w\u4e00-\u9fff]', '', base).lower()
              if not key:
                  key = "py" + str(hash(base) % 10000)
              return key[:20]

          def read_py_txt():
              """读取 py.txt，返回 {api_url: entry} 映射，条目均标记为 group=手动"""
              entries = {}
              if not os.path.isfile(PY_TXT):
                  print(f"[WARN] {PY_TXT} 不存在")
                  return entries

              with open(PY_TXT, 'r', encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith('#'):
                          continue
                      if ',' not in line:
                          continue
                      parts = line.split(',', 1)
                      if len(parts) != 2:
                          continue
                      filename = parts[0].strip()
                      api_url = parts[1].strip()
                      if not filename or not api_url:
                          continue

                      category = detect_category(filename)
                      key = generate_key(filename)
                      entries[api_url] = {
                          "key": key,
                          "name": f"🐬{filename}[{category}]",
                          "type": 3,
                          "api": api_url,
                          "group": MANUAL_GROUP
                      }
                      print(f"[INFO] 解析: {filename} -> {api_url} [group={MANUAL_GROUP}]")

              print(f"[DONE] py.txt 共 {len(entries)} 个条目")
              return entries

          def is_py_plugin(site):
              api = site.get('api', '')
              return bool(PY_API_PATTERN.search(api))

          def is_manual_py(site):
              """判断是否为手动管理的 PY 插件"""
              return is_py_plugin(site) and site.get('group') == MANUAL_GROUP

          def sync_json(target_file, expected_entries):
              if not os.path.isfile(target_file):
                  print(f"[WARN] {target_file} 不存在，跳过")
                  return False

              try:
                  with open(target_file, 'r', encoding='utf-8') as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"[ERROR] 读取 {target_file} 失败: {e}")
                  return False

              sites = data.get('sites', [])
              modified = False

              # 1. 删除：只删除 group=="手动" 且 py.txt 中已不存在的 PY 插件
              new_sites = []
              removed = 0
              for site in sites:
                  api = site.get('api', '')
                  if is_manual_py(site) and api not in expected_entries:
                      print(f"[DEL] 删除手动条目 {site.get('name', site.get('key', '?'))} (py.txt 中已不存在)")
                      removed += 1
                      modified = True
                  else:
                      new_sites.append(site)

              # 2. 添加：py.txt 中存在但 sites 中还没有的（检查所有 sites 的 api 去重）
              existed_apis = {s.get('api', '') for s in new_sites}
              added = 0
              for api_url, entry in expected_entries.items():
                  if api_url not in existed_apis:
                      new_sites.append(entry)
                      print(f"[ADD] 添加 {entry['name']} [group={MANUAL_GROUP}] 到 {target_file}")
                      added += 1
                      modified = True

              if modified:
                  data['sites'] = new_sites
                  with open(target_file, 'w', encoding='utf-8') as f:
                      json.dump(data, f, ensure_ascii=False, indent=4)
                  print(f"[DONE] {target_file}: 删除 {removed} 个手动条目，新增 {added} 个手动条目")
              else:
                  print(f"[INFO] {target_file}: 无需变更")

              return modified

          def main():
              print("[START] 读取 py.txt 并同步手动 PY 插件...")
              expected = read_py_txt()

              modified_any = False
              for target in TARGET_FILES:
                  if sync_json(target, expected):
                      modified_any = True

              if modified_any:
                  print("[DONE] 有文件被修改，准备提交")
              else:
                  print("[DONE] 所有文件已是最新")

          if __name__ == '__main__':
              main()
          PYEOF

      - name: Commit and push changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "✅ 没有需要提交的改动"
          else
            git commit -m "🔄 Auto-sync PY plugins [$(date '+%Y-%m-%d %H:%M')]"                        -m "- 根据 Lv/py.txt 同步手动 PY 插件到目标 JSON"                        -m "- 只操作 group=手动的 PY 插件条目，不影响其他已有条目"
            git push
            echo "🚀 提交已完成"
          fi
