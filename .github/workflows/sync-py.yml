name: Sync PY Plugins to JSON

on:
  push:
    paths:
      - 'PY/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-py:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan PY directory and inject to JSON files
        run: |
          python3 << 'PYEOF'
          import os
          import json
          import re
          import urllib.request

          REPO = "hegio/FG"
          BRANCH = "main"
          PY_DIR = "PY"
          TARGET_FILES = ["鱼壳海豚无18加", "ok海豚无18加"]
          RAW_BASE = f"https://ghfast.top/https://raw.githubusercontent.com/{REPO}/{BRANCH}/{PY_DIR}"

          # 分类推断规则
          CATEGORY_RULES = [
              ("直播", ["直播", "zb", "live", "电视", "tv", "iptv", "m3u", "轮播", "一起看"]),
              ("体育", ["体育", "ty", "sport", "球", "赛事", "竞技", "运动"]),
              ("音乐", ["音乐", "music", "dj", "fm", "电台", "radio", "歌曲", "mp3"]),
              ("听书", ["听书", "ts", "audio", "有声", "小说", "广播", "相声", "评书"]),
              ("短剧", ["短剧", "微剧", "爽文", "穿越", "逆袭", "都市"]),
              ("动漫", ["动漫", "动画", "anime", "cartoon", "少儿", "儿童"]),
              ("综艺", ["综艺", "娱乐", "真人秀", "选秀", "脱口秀"]),
              ("纪录", ["纪录", "documentary", "探索", "发现", "档案"]),
              ("其他", ["其他", "other", "工具", "测试"]),
          ]

          def detect_category(filename):
              """根据文件名推断分类"""
              name_lower = filename.lower()
              for category, keywords in CATEGORY_RULES:
                  for kw in keywords:
                      if kw.lower() in name_lower:
                          return category
              return "追剧"  # 默认分类

          def generate_key(filename):
              """生成唯一 key，去掉 .py 后缀，保留字母数字"""
              base = os.path.splitext(filename)[0]
              # 只保留字母数字中文，转小写
              key = re.sub(r'[^\w\u4e00-\u9fff]', '', base).lower()
              if not key:
                  key = "py" + str(hash(base) % 10000)
              return key[:20]  # 限制长度

          def fetch_py_files():
              """通过 GitHub API 获取 PY 目录下的 .py 文件列表"""
              api_url = f"https://api.github.com/repos/{REPO}/contents/{PY_DIR}?ref={BRANCH}"
              headers = {
                  'User-Agent': 'Mozilla/5.0',
                  'Accept': 'application/vnd.github.v3+json'
              }

              # 如果有 GITHUB_TOKEN，使用它避免 rate limit
              token = os.environ.get('GITHUB_TOKEN')
              if token:
                  headers['Authorization'] = f'token {token}'

              try:
                  req = urllib.request.Request(api_url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      items = json.loads(resp.read().decode('utf-8'))

                  py_files = []
                  for item in items:
                      if item.get('type') == 'file' and item['name'].endswith('.py'):
                          py_files.append({
                              'name': item['name'],
                              'download_url': item['download_url'],
                              'size': item.get('size', 0)
                          })
                  return py_files
              except Exception as e:
                  print(f"[ERROR] 获取 PY 目录失败: {e}")
                  # 降级：扫描本地目录
                  if os.path.isdir(PY_DIR):
                      py_files = []
                      for f in os.listdir(PY_DIR):
                          if f.endswith('.py'):
                              py_files.append({
                                  'name': f,
                                  'download_url': f"{RAW_BASE}/{f}",
                                  'size': os.path.getsize(os.path.join(PY_DIR, f))
                              })
                      return py_files
                  return []

          def build_site_entry(py_file):
              """构建 sites 条目"""
              filename = py_file['name']
              category = detect_category(filename)
              key = generate_key(filename)

              # 使用本地 raw 路径（通过 ghfast 代理）
              api_url = f"{RAW_BASE}/{filename}"

              return {
                  "key": key,
                  "name": f"🐬{filename}[{category}]",
                  "type": 3,
                  "api": api_url
              }

          def inject_to_json(target_file, py_entries):
              """将 py 条目注入到目标 JSON 的 sites 数组"""
              if not os.path.isfile(target_file):
                  print(f"[WARN] {target_file} 不存在，跳过")
                  return False

              try:
                  with open(target_file, 'r', encoding='utf-8') as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"[ERROR] 读取 {target_file} 失败: {e}")
                  return False

              sites = data.get('sites', [])
              existed_keys = {s.get('key', '') for s in sites}
              existed_apis = {s.get('api', '') for s in sites}

              added = 0
              for entry in py_entries:
                  # 按 key 和 api 双重去重
                  if entry['key'] not in existed_keys and entry['api'] not in existed_apis:
                      sites.append(entry)
                      existed_keys.add(entry['key'])
                      existed_apis.add(entry['api'])
                      print(f"[INFO] 添加 {entry['name']} (key={entry['key']}) 到 {target_file}")
                      added += 1
                  else:
                      print(f"[SKIP] {entry['name']} 已存在于 {target_file}")

              if added > 0:
                  data['sites'] = sites
                  with open(target_file, 'w', encoding='utf-8') as f:
                      json.dump(data, f, ensure_ascii=False, indent=4)
                  print(f"[DONE] {target_file} 新增 {added} 个 PY 插件")
                  return True
              else:
                  print(f"[INFO] {target_file} 无新增插件")
                  return False

          def main():
              print("[START] 扫描 PY 目录...")
              py_files = fetch_py_files()

              if not py_files:
                  print("[INFO] 未找到 .py 文件")
                  return

              print(f"[INFO] 发现 {len(py_files)} 个 .py 文件:")
              for pf in py_files:
                  print(f"  - {pf['name']} ({pf['size']} bytes)")

              # 构建所有 entries
              py_entries = [build_site_entry(pf) for pf in py_files]

              # 注入到目标文件
              modified = False
              for target in TARGET_FILES:
                  if inject_to_json(target, py_entries):
                      modified = True

              if modified:
                  print("[DONE] 有文件被修改，准备提交")
              else:
                  print("[DONE] 所有文件已是最新，无需修改")

          if __name__ == '__main__':
              main()
          PYEOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "✅ 没有需要提交的改动"
          else
            git commit -m "🔄 Auto-sync PY plugins [$(date '+%Y-%m-%d %H:%M')]"                        -m "- 自动侦测 PY 目录下的 .py 文件"                        -m "- 同步注入到 鱼壳海豚无18加 / ok海豚无18加"
            git push
            echo "🚀 提交已完成"
          fi
