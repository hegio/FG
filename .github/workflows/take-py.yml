name: Take PY Files List

on:
  push:
    paths:
      - 'PY/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  take-py:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Scan PY directory and generate py.txt
        run: |
          python3 << 'PYEOF'
          import os
          import re

          PY_DIR = "PY"
          OUTPUT_FILE = "Lv/py.txt"
          REPO = "hegio/FG"
          BRANCH = "main"
          RAW_BASE = f"https://ghfast.top/https://raw.githubusercontent.com/{REPO}/{BRANCH}/{PY_DIR}"

          if not os.path.isdir(PY_DIR):
              print(f"[WARN] {PY_DIR} 目录不存在")
              # 如果目录不存在，清空 py.txt
              os.makedirs(os.path.dirname(OUTPUT_FILE), exist_ok=True)
              with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
                  pass
              print(f"[DONE] 已清空 {OUTPUT_FILE}")
              exit(0)

          py_files = sorted([f for f in os.listdir(PY_DIR) if f.endswith('.py')])

          os.makedirs(os.path.dirname(OUTPUT_FILE), exist_ok=True)

          with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
              for filename in py_files:
                  url = f"{RAW_BASE}/{filename}"
                  f.write(f"{filename},{url}\n")
                  print(f"[INFO] 记录: {filename} -> {url}")

          print(f"[DONE] 共记录 {len(py_files)} 个 .py 文件到 {OUTPUT_FILE}")
          PYEOF

      - name: Commit and push changes
        run: |
          git add Lv/py.txt
          if git diff --cached --quiet; then
            echo "✅ 没有需要提交的改动"
          else
            git commit -m "🔄 Update py.txt - sync PY directory [$(date '+%Y-%m-%d %H:%M')]"
            git push
            echo "🚀 提交已完成"
          fi
